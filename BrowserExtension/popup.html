<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; font-family: "Segoe UI", sans-serif; margin: 12px; color: #222; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    button { width: 100%; padding: 8px; margin-top: 6px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #scanBtn { background: #2563eb; color: #fff; }
    #applyBtn { background: #059669; color: #fff; display: none; }
    pre { background: #f3f4f6; padding: 8px; border-radius: 6px; max-height: 220px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <h3>AiSecretary 表單助手</h3>
  <button id="scanBtn">讀取此頁表單並請 AI 建議</button>
  <button id="applyBtn">套用預填至欄位（不自動送出）</button>
  <pre id="status">準備就緒。密碼欄位會自動排除。</pre>
  <script src="popup.js"></script>
</body>
</html>
